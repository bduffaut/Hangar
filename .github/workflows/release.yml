# Publishes a release when a version tag is pushed. Nothing runs until someone pushes a v* tag.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      packages: write # the image on GHCR
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Read the version
        id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/core.Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: HANGAR_VERSION=${{ steps.version.outputs.number }}
          tags: ghcr.io/bduffaut/hangar-core:${{ steps.version.outputs.number }}
      - name: Package the installer
        run: |
          tar -czf hangar-installer.tar.gz installer
          sha256sum hangar-installer.tar.gz > hangar-installer.tar.gz.sha256
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            hangar-installer.tar.gz hangar-installer.tar.gz.sha256
