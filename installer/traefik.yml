# Static Traefik configuration. Routes live in the dynamic directory and are written by hangar-core.
entryPoints:
  web:
    address: ':80'
  public:
    address: ':8081' # reached only by cloudflared over the hangar network
  traefik:
    address: ':8082' # API and ping; never published to the host in production

# The API has no router of its own: core adds one that requires a secret header, so apps on the
# same Docker networks cannot read the routes (and so everyone's project names and addresses).
api:
  dashboard: false

ping:
  entryPoint: traefik

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO

global:
  checkNewVersion: false
  sendAnonymousUsage: false
