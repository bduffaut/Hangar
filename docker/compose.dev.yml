# Development stack. Container names, network, and paths match production so code behaves the same.
name: hangar-dev

services:
  hangar-db:
    image: postgres:18
    container_name: hangar-db
    environment:
      POSTGRES_USER: hangar
      POSTGRES_PASSWORD: hangar
      POSTGRES_DB: hangar
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hangar -d hangar']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [hangar]

  hangar-proxy:
    image: traefik:v3.5
    container_name: hangar-proxy
    command: ['--configFile=/etc/traefik/traefik.yml']
    volumes:
      - ../installer/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik-dynamic:/etc/traefik/dynamic:ro
    ports:
      - 80:80
      - 127.0.0.1:8082:8082
    networks: [hangar]

  hangar-core:
    build:
      context: ..
      dockerfile: docker/core.Dockerfile
      target: dev
    container_name: hangar-core
    environment:
      DATABASE_URL: postgres://hangar:hangar@hangar-db:5432/hangar
      HANGAR_LAN_IP: 127.0.0.1
      # Development-only secrets. Production values are generated by the installer.
      HANGAR_INSTANCE_KEY: ZGV2LW9ubHktaW5zdGFuY2Uta2V5LTMyLWJ5dGVzISE=
      HANGAR_SESSION_SECRET: dev-only-session-secret-not-for-production
      HANGAR_TRAEFIK_DYNAMIC_DIR: /var/lib/hangar/traefik
      HANGAR_MIGRATIONS_DIR: /repo/apps/server/drizzle
      # The Vite dev server proxies /api here; direct calls on port 3000 are for tools and tests.
      HANGAR_DEV_ORIGINS: http://localhost:5173,http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ..:/repo
      - /var/run/docker.sock:/var/run/docker.sock
      - traefik-dynamic:/var/lib/hangar/traefik
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      hangar-db:
        condition: service_healthy
    networks: [hangar]

volumes:
  db-data:
  traefik-dynamic:

networks:
  hangar:
    external: true
