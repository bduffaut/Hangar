# The public site: static files only. Every known page has its own index.html; anything else gets
# the app through 404.html, which shows its own "not found" page (scripts/site-postbuild.mjs).
# A location that adds a header drops the server's, so each one includes site-headers.inc.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/site-headers.inc;
    }

    # Every address in the tour (/tour/projects/blog, ...) is a page of the app.
    location /tour/ {
        try_files $uri $uri/index.html /tour/index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/site-headers.inc;
    }

    # File names carry a content hash, so they never change.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/site-headers.inc;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/site-headers.inc;
    }
}
